<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction(){
            document.getElementById('demo').innerHTML='I dont need you!';
        }
    </script>
</head>
<body>
    <h2>Js On HEAD</h2>
    <p id="demo">My name is RI</p>
    <button type="button" onclick="myFunction()">Click Me</button>
</body>
</html>
